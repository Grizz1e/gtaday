# Render deploy config — single always-on Web Service for GTA Clock.
services:
  - type: web
    name: gtaclock
    runtime: node
    plan: starter # 'starter' ($7/mo) never sleeps. 'free' sleeps after 15 min idle — pair with an external pinger.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
