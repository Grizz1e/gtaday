<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA Clock — Grand Theft Auto VI Countdown | gtaclock.com</title>
  
  <meta name="description" content="Live countdown to the release of Grand Theft Auto VI on November 19, 2026 at 00:00 local time. Pre-order for PlayStation 5 & Xbox Series X|S, add to calendar, and get browser alerts." />
  <meta property="og:title" content="GTA Clock — GTA 6 Release Countdown" />
  <meta property="og:description" content="Counting down to November 19, 2026 at 00:00 local time. Pre-order and add to your calendar." />
  <meta property="og:url" content="https://gtaclock.com" />
  <meta property="og:image" content="/assets/gta-vi-gas-station.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0d0716" />

  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" type="image/png" href="/assets/gta-vi-logo.png" />
</head>
<body>

  <!-- Cinematic Background (Brightened & Vibrant) -->
  <div class="backdrop-wrapper">
    <div class="backdrop-art"></div>
    <div class="backdrop-vignette"></div>
    <div class="backdrop-bloom"></div>
  </div>

  <!-- Centered Hero Stage -->
  <main class="hero-stage">
    <div class="hero-content">

      <!-- Official GTA VI Emblem -->
      <div class="hero-logo-wrap">
        <img src="/assets/gta-vi-logo.png" alt="Grand Theft Auto VI" class="gta-emblem" />
      </div>

      <!-- High-Impact Floating Countdown with Independent Per-Digit Sliding -->
      <section class="clock-display" aria-label="Countdown to launch">
        <div class="digits-row">
          <div class="digit-cell">
            <div class="unit-digits" id="unit-days"></div>
            <span class="label">DAYS</span>
          </div>
          <span class="sep">:</span>
          <div class="digit-cell">
            <div class="unit-digits" id="unit-hours"></div>
            <span class="label">HOURS</span>
          </div>
          <span class="sep">:</span>
          <div class="digit-cell">
            <div class="unit-digits" id="unit-minutes"></div>
            <span class="label">MINUTES</span>
          </div>
          <span class="sep">:</span>
          <div class="digit-cell">
            <div class="unit-digits" id="unit-seconds"></div>
            <span class="label">SECONDS</span>
          </div>
        </div>

        <div class="clock-meta">
          <span class="meta-date">Thursday, November 19, 2026</span>
          <span class="meta-dot">•</span>
          <button class="meta-tz-btn" id="tzBtn" title="Click to change timezone" aria-label="Change timezone" aria-haspopup="dialog">
            <span id="tzLabel">Detecting timezone...</span>
            <svg class="tz-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>
      </section>

      <!-- Platforms Pre-Order Section (Clickable Official Links) -->
      <section class="platforms-hub" aria-label="Available on platforms">
        <div class="platforms-dock">
          <!-- PlayStation 5 -->
          <a href="https://www.playstation.com/en-us/games/grand-theft-auto-vi/" target="_blank" rel="noopener noreferrer" class="platform-card ps5-card" title="Buy / Wishlist on PlayStation">
            <div class="platform-brand">
              <img src="/assets/ps5.png" alt="PlayStation 5" class="brand-logo" />
            </div>
            <div class="platform-action">
              <span>BUY</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </div>
          </a>

          <!-- Xbox Series X|S -->
          <a href="https://www.xbox.com/en-US/games/grand-theft-auto-vi" target="_blank" rel="noopener noreferrer" class="platform-card xbox-card" title="Buy / Wishlist on Xbox">
            <div class="platform-brand">
              <img src="/assets/xbox-series-xs.png" alt="Xbox Series X|S" class="brand-logo" />
            </div>
            <div class="platform-action">
              <span>BUY</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </div>
          </a>
        </div>
      </section>

      <!-- Action Capsule: Add to Calendar & Browser Alerts -->
      <section class="action-hub" aria-label="Reminders and Calendar">
        <div class="action-pills">
          
          <!-- Add to Calendar Pill -->
          <button class="action-pill cal-pill" id="calPillBtn" title="Add GTA 6 Launch to your Calendar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Add to Calendar</span>
          </button>

          <!-- Browser Notification Pill -->
          <button class="action-pill notify-pill" id="browserAlertBtn" title="Get browser notifications on launch day">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span id="browserPillText">Browser Alert</span>
          </button>

        </div>

        <div class="action-feedback" id="statusMsg"></div>
      </section>

    </div>
  </main>

  <!-- Calendar Quick Modal -->
  <div class="cal-modal-overlay hidden" id="calModal">
    <div class="cal-modal-box">
      <div class="cal-modal-head">
        <h3>Add to Calendar</h3>
        <button class="cal-modal-close" id="closeCalModal" aria-label="Close modal">&times;</button>
      </div>
      <p class="cal-modal-info">Never miss the launch on November 19, 2026 at 00:00 local time. Choose your calendar:</p>
      <div class="cal-options">
        <a href="#" id="gCalLink" target="_blank" rel="noopener noreferrer" class="cal-link-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
          </svg>
          Google Calendar
        </a>
        <button id="icsBtn" class="cal-link-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Apple / Outlook (.ics)
        </button>
      </div>
    </div>
  </div>

  <!-- Timezone Selector Modal -->
  <div class="tz-modal-overlay hidden" id="tzModal">
    <div class="tz-modal-box">
      <div class="tz-modal-head">
        <h3>Change Timezone</h3>
        <button class="tz-modal-close" id="closeTzModal" aria-label="Close modal">&times;</button>
      </div>
      <p class="tz-modal-info">Countdown will target midnight (00:00) on November 19, 2026 in your chosen timezone.</p>

      <div class="tz-search-wrap">
        <svg class="tz-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="tzSearchInput" placeholder="Search city or timezone (e.g. London, New York, Tokyo)..." autocomplete="off" />
      </div>

      <div class="tz-quick-row">
        <button class="tz-chip" data-tz="auto">Auto (Detect)</button>
        <button class="tz-chip" data-tz="Asia/Kathmandu">Kathmandu</button>
        <button class="tz-chip" data-tz="America/New_York">New York</button>
        <button class="tz-chip" data-tz="Europe/London">London</button>
        <button class="tz-chip" data-tz="Asia/Tokyo">Tokyo</button>
      </div>

      <div class="tz-list" id="tzList">
        <!-- Dynamically rendered timezone items -->
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
